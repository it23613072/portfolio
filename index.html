<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <meta name="description" content="Professional Portfolio - View my projects, skills, and experience">
    <meta name="theme-color" content="#efebe2">
    <title>Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=Playfair+Display:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">Portfolio</a>
            <ul class="nav-menu">
                <li class="nav-item"><a href="index.html" class="nav-link active">Home</a></li>
                <li class="nav-item"><a href="projects.html" class="nav-link">Projects</a></li>
                <li class="nav-item"><a href="#contact" class="nav-link">Contact</a></li>
            </ul>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <!-- Hero Section with P.png Design -->
    <section id="hero" class="hero-section">
        <div class="hero-image-container">
            <img src="P.png" alt="Portfolio Design" class="hero-main-image">
        </div>
        <div class="scroll-indicator">
            <div class="mouse"></div>
            <p>Scroll Down</p>
        </div>
    </section>

    <!-- Introduction Section -->
    <section id="intro" class="intro-section">
        <div class="container">
            <div class="intro-content">
                <h2 class="section-title">About Me</h2>
                <div class="about-wrapper">
                    <div class="about-profile">
                        <img id="profileImage" src="" alt="Profile" class="profile-image">
                    </div>
                    <div id="introContent" class="intro-text">
                        <p>Loading...</p>
                    </div>
                </div>
                <div id="connectSection" class="connect-section"></div>
            </div>
        </div>
    </section>

    <!-- Skills Section -->
    <section id="skills" class="skills-section">
        <div class="container">
            <h2 class="section-title">Skills</h2>
            <div id="skillsContent" class="skills-grid">
                <!-- Skills will be loaded dynamically -->
            </div>
        </div>
    </section>

    <!-- Education Section -->
    <section id="education" class="education-section">
        <div class="container">
            <h2 class="section-title">Education</h2>
            <div id="educationContent" class="education-timeline">
                <!-- Education will be loaded dynamically -->
            </div>
        </div>
    </section>

    <!-- Projects Section -->
    <section id="projects" class="projects-section">
        <div class="container">
            <div class="projects-header">
                <h2 class="section-title">Featured Projects</h2>
                <a href="projects.html" class="view-all-btn">View All Projects <i class="fas fa-arrow-right"></i></a>
            </div>
            <div id="projectsContent" class="projects-grid-preview">
                <!-- Projects preview will be loaded dynamically -->
            </div>
        </div>
    </section>

    <!-- Contact Section -->
    <section id="contact" class="contact-section">
        <div class="container">
            <h2 class="section-title">Get In Touch</h2>
            <div class="contact-wrapper">
                <form id="contactForm" class="contact-form">
                    <div class="form-group">
                        <input type="text" name="name" placeholder="Your Name" required>
                    </div>
                    <div class="form-group">
                        <input type="email" name="email" placeholder="Your Email" required>
                    </div>
                    <div class="form-group">
                        <input type="text" name="subject" placeholder="Subject">
                    </div>
                    <div class="form-group">
                        <textarea name="message" rows="5" placeholder="Your Message" required></textarea>
                    </div>
                    <button type="submit" class="submit-btn">Send Message</button>
                </form>
                <div class="social-links" id="socialLinks">
                    <!-- Social links will be loaded dynamically -->
                </div>
            </div>
            <div id="formMessage" class="form-message"></div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <p>&copy; <span id="currentYear"></span> Portfolio. All rights reserved.</p>
    </footer>

    <!-- Project Modal -->
    <div id="projectModal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <div id="modalContent">
                <!-- Project details will be loaded here -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
