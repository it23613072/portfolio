<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="My Portfolio Projects - Featuring videos and live demos">
    <meta name="theme-color" content="#efebe2">
    <title>Projects - Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="projects.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600;700&family=Playfair+Display:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">Portfolio</a>
            <ul class="nav-menu">
                <li class="nav-item"><a href="index.html" class="nav-link">Home</a></li>
                <li class="nav-item"><a href="about.html" class="nav-link">About</a></li>
                <li class="nav-item"><a href="projects.html" class="nav-link active">Projects</a></li>
                <li class="nav-item"><a href="index.html#contact" class="nav-link">Contact</a></li>
            </ul>
            <div class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section class="projects-hero">
        <div class="hero-content">
            <h1>Featured Projects</h1>
            <p>Innovative solutions and creative implementations</p>
        </div>
        <div class="hero-gradient"></div>
    </section>

    <!-- Filter Buttons -->
    <section class="filters-section">
        <div class="container">
            <div class="filters">
                <button class="filter-btn active" data-filter="all">All Projects</button>
                <button class="filter-btn" data-filter="web">Web Development</button>
                <button class="filter-btn" data-filter="mobile">Mobile Apps</button>
                <button class="filter-btn" data-filter="tools">Tools & Utilities</button>
            </div>
        </div>
    </section>

    <!-- Projects Grid -->
    <section id="projectsContent" class="projects-showcase">
        <div class="container">
            <div class="projects-grid">
                <!-- Projects will be loaded dynamically from admin -->
            </div>
        </div>
    </section>

    <!-- Skills Highlight Section -->
    <section class="skills-highlight">
        <div class="container">
            <h2>Technologies & Skills Used</h2>
            <div id="techStack" class="tech-grid">
                <!-- Technologies will be loaded dynamically -->
            </div>
        </div>
    </section>

    <!-- Call to Action -->
    <section class="cta-section">
        <div class="container">
            <div class="cta-content">
                <h2>Interested in Working Together?</h2>
                <p>Let's create something amazing</p>
                <a href="index.html#contact" class="cta-button">Get In Touch</a>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Portfolio. All rights reserved.</p>
        </div>
    </footer>

    <!-- Modal for Project Details -->
    <div id="projectModal" class="modal">
        <div class="modal-content">
            <span class="close-modal">&times;</span>
            <div class="modal-body">
                <div class="modal-video">
                    <video id="modalVideo" controls>
                        <source src="" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>
                </div>
                <div class="modal-details">
                    <h2 id="modalTitle"></h2>
                    <p id="modalDescription"></p>
                    <div class="modal-technologies">
                        <span class="tech-tag" id="modalTechs"></span>
                    </div>
                    <a id="modalLink" href="#" class="project-link" target="_blank">View Project <i class="fas fa-external-link-alt"></i></a>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script src="projects.js"></script>
</body>
</html>
